# GitHub logins enrolled in the security experiment.
#
# Reviews of PRs by anyone on this list get a security pass when the change touches a
# sensitive file: the reviewer hands those files to the duchamp-security-reviewer
# subagent and posts the leads it confirms. This is separate from the review
# experiment: a PR can be in one, both or neither.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `security-review` label, which
# runs the pass on the whole change, without being on this list.
#
# See README.md in this directory.

