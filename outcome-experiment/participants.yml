# GitHub logins enrolled in the outcome experiment.
#
# When a PR by anyone on this list merges, a job records what happened to each inline
# comment the AI review left: whether the code changed the way it asked, the 👍/👎 on
# it, and what people replied. It changes nothing in the review. This is separate from
# the other experiments: a PR can be in any mix of them.
#
# It only runs in repos whose `run-claude-review.yml` lists `closed` in its
# pull_request types.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `ai-review-outcome` label,
# without being on this list.
#
# See README.md in this directory.

