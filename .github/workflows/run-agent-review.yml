name: AI PR Review

on:
  pull_request:
    # `closed` is for the outcome experiment; see outcome-experiment/README.md.
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, closed]

jobs:
  claude-review:
    uses: artsy/duchamp/.github/workflows/agent-review.yml@main
    secrets:
      litellm-api-key: ${{ secrets.AI_REVIEW_LITELLM_API_KEY }}
      litellm-edge-token: ${{ secrets.AI_REVIEW_LITELLM_EDGE_TOKEN }}
