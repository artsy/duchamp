name: Open agent wrappers sync PR

# Reusable workflow. A consuming repo calls this on push to its default
# branch (filtered to AGENTS.md). It regenerates the agent wrapper files
# from AGENTS.md and, if they drifted, opens a PR with the update and
# enables auto-merge.
#
# Requires a token (PAT or GitHub App) with Contents + Pull requests
# write on the calling repo, passed as the `sync-token` secret. The
# default GITHUB_TOKEN is intentionally not used: commits and PRs it
# creates do not trigger the repo's required status checks, so auto-merge
# would never satisfy them and the PR would hang.
on:
  workflow_call:
    secrets:
      sync-token:
        required: true

jobs:
  open-pr:
    name: Open agent wrappers sync PR
    runs-on: ubuntu-latest
    steps:
      # Check out with the sync-token so its credentials are the ones
      # persisted into git config (as http.extraheader). Otherwise
      # actions/checkout persists the default GITHUB_TOKEN, whose header
      # takes precedence over `gh auth setup-git` and would make the raw
      # `git push` below authenticate as GITHUB_TOKEN — which does not
      # trigger the opened PR's required checks, so auto-merge would hang.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.sync-token }}

      - name: Generate wrapper files
        uses: artsy/duchamp/.github/actions/sync-agent-wrappers@main

      - name: Open PR if wrappers drifted
        env:
          GH_TOKEN: ${{ secrets.sync-token }}
        run: |
          set -euo pipefail
          if git diff --quiet .cursorrules .github/copilot-instructions.md; then
            echo "Wrappers already in sync with AGENTS.md — nothing to do."
            exit 0
          fi

          BRANCH="chore/sync-agent-wrappers"
          BASE="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the sync branch fresh from the pushed commit and
          # force-push, so it never accumulates stale history. The push
          # authenticates with the sync-token persisted at checkout.
          git checkout -b "$BRANCH"
          git add .cursorrules .github/copilot-instructions.md
          git commit -m "chore: sync agent wrappers from AGENTS.md"
          git push -f origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" \
              --title "chore: sync agent wrappers from AGENTS.md" \
              --body "Automated regeneration of \`.cursorrules\` and \`.github/copilot-instructions.md\` from \`AGENTS.md\`. Do not edit these wrappers directly — change \`AGENTS.md\` instead."
          else
            echo "Sync PR #$existing already open; branch updated."
          fi

          # Non-fatal: if the repo disallows auto-merge, leave the PR open
          # for a manual merge rather than failing the workflow.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::could not enable auto-merge (PR left open for manual merge)"
