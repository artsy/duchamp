name: AI PR Review (old name)

# The review moved to agent-review.yml. This keeps callers of the old path working until
# each repo's run-agent-review.yml points at the new one; delete it once none call it.
on:
  workflow_call:
    secrets:
      anthropic-api-key:
        required: false
      review-app-private-key:
        required: false
      openai-api-key:
        required: false
      litellm-api-key:
        required: false
      litellm-edge-token:
        required: false
    inputs:
      model:
        default: "claude-opus-5-5"
        required: false
        type: string
      timeout-minutes:
        default: 30
        required: false
        type: number

jobs:
  claude-review:
    uses: artsy/duchamp/.github/workflows/agent-review.yml@main
    with:
      model: ${{ inputs.model }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
    secrets:
      anthropic-api-key: ${{ secrets.anthropic-api-key }}
      review-app-private-key: ${{ secrets.review-app-private-key }}
      openai-api-key: ${{ secrets.openai-api-key }}
      litellm-api-key: ${{ secrets.litellm-api-key }}
      litellm-edge-token: ${{ secrets.litellm-edge-token }}
