name: Claude AI PR Review

on:
  workflow_call:
    secrets:
      anthropic-api-key:
        required: true
      review-app-private-key:
        description: "Private key of the Artsy Review Context GitHub App, which reads private repos listed in related_repos. Without it, private repos are skipped"
        required: false
      openai-api-key:
        description: "OpenAI API key for the Codex experiment's second review. Without it, only Claude reviews"
        required: false
    inputs:
      model:
        description: "Claude model to use for the review"
        default: "claude-opus-5-5"
        required: false
        type: string
      timeout-minutes:
        description: "Maximum time for the review job"
        default: 30
        required: false
        type: number

jobs:
  # Adding the in-progress label joins the shared concurrency group, which
  # cancels any check/review job already running for this PR.
  cancel-on-in-progress:
    if: github.event.action == 'labeled' && github.event.label.name == 'in-progress'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - run: echo "in-progress label added, cancelled any running review"

  # What happened to the review's findings, and what people caught that it missed, for the
  # outcome and missed-findings experiments. Runs only where the caller lists `closed` in
  # its pull_request types. See outcome-experiment/README.md.
  outcome:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout tooling repo
        uses: actions/checkout@v4
        with:
          repository: artsy/duchamp
          ref: main
          path: .tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install tooling dependencies
        run: yarn install --frozen-lockfile
        working-directory: .tooling
        env:
          YARN_IGNORE_PATH: 1

      - name: Measure review outcome
        run: npx ts-node .tooling/scripts/review-outcome.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          # Forwards the metrics to Datadog; see review/datadog/README.md.
          VOLLEY_URL: https://volley.artsy.net/report

      - name: Find what the review missed
        if: ${{ !cancelled() }}
        run: npx ts-node .tooling/scripts/review-missed.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          VOLLEY_URL: https://volley.artsy.net/report

  check:
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Fast-path exclusions: drafts, bots, dependabot, renovate, in-progress label (zero overhead).
    # `closed` only reaches here from callers in the outcome experiment; it never starts a review.
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.user.login, '[bot]') &&
      github.event.pull_request.user.login != 'dependabot' &&
      github.event.pull_request.user.login != 'renovate' &&
      !contains(github.event.pull_request.labels.*.name, 'in-progress') &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'in-progress' ||
       github.event.action == 'labeled' && github.event.label.name == 'security-review')
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_OPENAI_KEY: ${{ secrets.openai-api-key != '' }}
    outputs:
      should-review: ${{ steps.org-check.outputs.should-review }}
      review-timeout: ${{ steps.timeout.outputs.minutes }}
    steps:
      - name: Checkout PR repo (sparse - config only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .claude-review.yml
          sparse-checkout-cone-mode: false

      - name: Checkout tooling repo
        uses: actions/checkout@v4
        with:
          repository: artsy/duchamp
          ref: main
          path: .tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install tooling dependencies
        run: yarn install --frozen-lockfile
        working-directory: .tooling
        env:
          YARN_IGNORE_PATH: 1

      - name: Check title exclusions
        id: title-check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { checkTitleExclusion } = require('./.tooling/scripts/check-pr-exclusions.js');

            const title = context.payload.pull_request.title;

            // Read config from checked-out file
            let configContent = null;
            try {
              configContent = fs.readFileSync('.claude-review.yml', 'utf8');
            } catch {
              // No config file, use defaults only
            }

            const result = checkTitleExclusion(title, configContent);

            console.log(`Title: "${title}"`);
            console.log(`Config found: ${configContent !== null}`);
            console.log(`Excluded: ${result.excluded}`);
            if (result.reason) console.log(`Reason: ${result.reason}`);

            core.setOutput('excluded', result.excluded.toString());
            core.setOutput('reason', result.reason || '');

      - name: Check if author can write to repo
        id: org-check
        if: steps.title-check.outputs.excluded != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            // Check if user has write permission to the repo (members/collaborators do)
            try {
              const { data: permissionLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username
              });

              const permission = permissionLevel.permission;
              console.log(`Author: ${username}, Permission: ${permission}`);

              // admin, write, maintain = trusted; read, none = not trusted
              const trustedPermissions = ['admin', 'write', 'maintain'];

              if (trustedPermissions.includes(permission)) {
                console.log(`✓ ${username} has trusted permission: ${permission}`);
                core.setOutput('should-review', 'true');
              } else {
                console.log(`✗ ${username} has permission: ${permission}. Skipping AI review.`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `🤖 **AI Review skipped** - PR author does not have write access to this repository.`
                });
                core.setOutput('should-review', 'false');
              }
            } catch (error) {
              // If we can't check permissions, user is likely not a collaborator
              console.log(`✗ Could not verify permissions for ${username}: ${error.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🤖 **AI Review skipped** - Could not verify PR author has access to this repository.`
              });
              core.setOutput('should-review', 'false');
            }

      # Codex runs after Claude in the same job, so its PRs get extra time instead of
      # cutting into Claude's. Expressions can't add numbers, so this step does it.
      - name: Size the review job
        id: timeout
        if: steps.org-check.outputs.should-review == 'true'
        run: |
          codex=$(PR_AUTHOR="$PR_AUTHOR" PR_LABELS="$PR_LABELS" GITHUB_OUTPUT=/dev/null \
            npx ts-node .tooling/scripts/build-review-prompt.ts --check-experiment | sed -n 's/^Codex: //p')
          extra=0
          if [ "$codex" = "true" ] && [ "$HAS_OPENAI_KEY" = "true" ]; then extra=$CODEX_EXTRA_MINUTES; fi
          echo "minutes=$((TIMEOUT_MINUTES + extra))" >> "$GITHUB_OUTPUT"
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          # The Codex step's own limit plus a few minutes to post the comparison.
          CODEX_EXTRA_MINUTES: 20

  review:
    needs: check
    if: needs.check.outputs.should-review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.check.outputs.review-timeout || format('{0}', inputs.timeout-minutes)) }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write  # Required for resolveReviewThread GraphQL mutation
      pull-requests: write
      id-token: write
    # Step conditions can't read secrets, so this says whether the caller passed the key.
    env:
      HAS_OPENAI_KEY: ${{ secrets.openai-api-key != '' }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout tooling repo
        uses: actions/checkout@v4
        with:
          repository: artsy/duchamp
          ref: main
          path: .tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install tooling dependencies
        run: yarn install --frozen-lockfile
        working-directory: .tooling
        env:
          YARN_IGNORE_PATH: 1

      - name: Check experiments
        id: experiment
        run: npx ts-node .tooling/scripts/build-review-prompt.ts --check-experiment
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Reads private related repos, only for reviews that use them. A caller that
      # doesn't pass the key yet still gets a review, just without the private repos.
      - name: Mint related repos token
        id: related-token
        if: steps.experiment.outputs.related_repos == 'true' && vars.REVIEW_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.review-app-private-key }}
          owner: artsy
          permission-contents: read

      - name: Build review prompt
        id: prompt
        run: npx ts-node .tooling/scripts/build-review-prompt.ts
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DEFAULT_MODEL: ${{ inputs.model }}
          RELATED_REPOS_TOKEN: ${{ steps.related-token.outputs.token }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Set only when this run was started by adding a label.
          TRIGGER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}
          GH_TOKEN: ${{ github.token }}

      - name: Install review skills and agents
        env:
          STACK_SKILLS: ${{ steps.prompt.outputs.stack_skills }}
          MERGE_RISK: ${{ steps.prompt.outputs.merge_risk }}
        run: |
          mkdir -p "$HOME/.claude/skills" "$HOME/.claude/agents"
          cp -R .tooling/.claude/skills/. "$HOME/.claude/skills/"
          cp -R .tooling/.claude/agents/. "$HOME/.claude/agents/"
          # Only the stack skills this review uses, so other reviews can't load them.
          for skill in $STACK_SKILLS; do
            cp -R ".tooling/.claude/stack-skills/$skill" "$HOME/.claude/skills/"
          done
          if [ "$MERGE_RISK" = "true" ]; then
            cp -R .tooling/.claude/experiment-skills/merge-risk "$HOME/.claude/skills/"
          fi
          ls "$HOME/.claude/skills" "$HOME/.claude/agents"

      - name: Resolve previous AI inline threads
        if: steps.prompt.outputs.review_mode != 'skip'
        uses: actions/github-script@v7
        with:
          script: |
            const { cleanupPreviousAIReviews } = require('./.tooling/scripts/cleanup-ai-reviews.js');
            await cleanupPreviousAIReviews({ github, context, core });

      # Codex has no network, so it reads the PR from a file. Saved before Claude runs,
      # so Codex never sees Claude's review of this push.
      - name: Save the PR for Codex
        continue-on-error: true
        if: steps.prompt.outputs.codex == 'true' && steps.prompt.outputs.review_mode != 'skip' && env.HAS_OPENAI_KEY == 'true'
        # Without --comments gh prints the description; with it, only the comments.
        run: |
          {
            gh pr view "$PR_NUMBER"
            echo
            gh pr view "$PR_NUMBER" --comments
          } > "$PR_FILE"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILE: ${{ steps.prompt.outputs.codex_pr_file }}
          GH_TOKEN: ${{ github.token }}

      - name: Run Claude Code Review
        id: review
        if: steps.prompt.outputs.review_mode != 'skip'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          # tool_args decide who posts the summary: see formatDelivery in build-review-prompt.ts.
          claude_args: >-
            ${{ steps.prompt.outputs.model_args }}
            ${{ steps.prompt.outputs.tool_args }}
          prompt: ${{ steps.prompt.outputs.review_prompt }}

      - name: Post review summary
        if: always() && steps.review.outcome != 'skipped'
        run: npx ts-node .tooling/scripts/post-review-summary.ts
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODEL_ARGS: ${{ steps.prompt.outputs.model_args }}
          EXPERIMENT: ${{ steps.experiment.outputs.experiment }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED_SINCE: ${{ steps.prompt.outputs.reviewed_since }}
          GH_TOKEN: ${{ github.token }}

      - name: Report review usage
        if: always() && steps.review.outputs.execution_file != ''
        run: npx ts-node .tooling/scripts/review-usage.ts
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          MODEL_ARGS: ${{ steps.prompt.outputs.model_args }}
          EXPERIMENT: ${{ steps.experiment.outputs.experiment }}
          REVIEW_MODE: ${{ steps.prompt.outputs.review_mode }}
          SECURITY_PASS: ${{ steps.prompt.outputs.security_pass }}
          BEST_PRACTICES: ${{ steps.prompt.outputs.best_practices }}
          RELATED_REPOS: ${{ steps.prompt.outputs.related_repos_read }}
          MERGE_RISK: ${{ steps.prompt.outputs.merge_risk }}
          REPLIES: ${{ steps.prompt.outputs.replies }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Forwards the metrics to Datadog; see review/datadog/README.md.
          VOLLEY_URL: https://volley.artsy.net/report

      # The Codex steps go last: the action drops sudo for every step after it. They
      # run even when Claude's review failed, and their failures don't turn the check red.
      - name: Prepare Codex
        id: codex-prep
        continue-on-error: true
        if: >-
          !cancelled() && steps.prompt.outputs.codex == 'true' &&
          steps.prompt.outputs.review_mode != 'skip' && env.HAS_OPENAI_KEY == 'true'
        run: |
          mkdir -p "$HOME/.agents/skills"
          cp -R "$HOME/.claude/skills/." "$HOME/.agents/skills/"
          # Checkout leaves the job's token in .git/config, and claude-code-action puts its
          # app token in the origin URL. Codex can read both, so remove them.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C .tooling config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C .tooling remote set-url origin https://github.com/artsy/duchamp.git

      - name: Run Codex review
        id: codex
        continue-on-error: true
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.codex-prep.outcome == 'success' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.openai-api-key }}
          prompt-file: ${{ steps.prompt.outputs.codex_prompt_file }}
          output-file: ${{ runner.temp }}/codex-review.json
          output-schema-file: ${{ github.workspace }}/.tooling/codex-experiment/output-schema.json
          # The legacy sandbox, because permission profiles are still beta. read-only
          # can read the related repo clones and the PR file under RUNNER_TEMP.
          sandbox: read-only
          model: gpt-6.1-terra
          effort: high

      # Posts Codex's inline comments, then one comment with both reviews side by side.
      # Claude's own summary and inline comments stay. See scripts/post-side-by-side.ts.
      - name: Post Claude | Codex
        continue-on-error: true
        if: ${{ !cancelled() && steps.codex-prep.outcome == 'success' }}
        run: npx ts-node .tooling/scripts/post-side-by-side.ts
        env:
          CODEX_REVIEW_FILE: ${{ runner.temp }}/codex-review.json
          CLAUDE_OUTCOME: ${{ steps.review.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
