name: Detect Secrets

on:
  workflow_call:
    inputs:
      baseline-path:
        description: "Path to the detect-secrets baseline file"
        required: false
        type: string
        default: ".secrets.baseline"

jobs:
  detect-secrets:
    name: Scan changed files for secrets
    runs-on: ubuntu-latest
    container:
      image: artsy/detect-secrets:ci # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run detect-secrets against changed files
        env:
          BASELINE_PATH: ${{ inputs.baseline-path }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="origin/${{ github.event.repository.default_branch }}"
          fi

          cp "$BASELINE_PATH" /tmp/.secrets.baseline
          set +e
          set +o pipefail
          detect-secrets-hook --baseline "$BASELINE_PATH" $(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD)
          code=$?
          if [[ $code -ne 3 ]]; then
            if [[ $code -ne 0 ]]; then
              echo "::error::detect-secrets found a potential secret. See output above."
            fi
            exit $code
          else
            lines=$(diff -y --suppress-common-lines "$BASELINE_PATH" /tmp/.secrets.baseline | wc -l)
            if [ "$lines" -eq 1 ]; then
              git restore "$BASELINE_PATH"
              exit 0
            fi
            echo "::error::Changes to $BASELINE_PATH need to be committed locally."
            exit $code
          fi
