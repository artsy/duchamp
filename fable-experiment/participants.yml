# GitHub logins enrolled in the Fable experiment.
#
# Deep reviews of PRs by anyone on this list run on Claude Fable 5.2 where they would
# have used the default model. A review is deep when it touches a sensitive file or
# changes more than 400 lines. This is separate from the other experiments: a PR can
# be in any mix of them. It needs lean reviews, which every PR has.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `ai-review-fable` label,
# without being on this list.
#
# See README.md in this directory.

