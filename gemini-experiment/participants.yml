# GitHub logins enrolled in the Gemini experiment.
#
# PRs by anyone on this list get a second review from Gemini Neon 4, run in Antigravity
# CLI through Artsy's LiteLLM gateway, from the same prompt as Claude's. Both show in
# one side-by-side comment. This is separate from the other experiments: a PR can be in
# any mix of them.
#
# Only repos that pass the `litellm-api-key` secret run Gemini. Elsewhere, enrolment
# does nothing.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `ai-review-gemini` label,
# without being on this list.
#
# See README.md in this directory.

