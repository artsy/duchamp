# GitHub logins enrolled in the Codex experiment.
#
# PRs by anyone on this list get a second review from OpenAI Codex, next to Claude's,
# from the same prompt. Codex posts one summary comment titled "Codex Review". This is
# separate from the other experiments: a PR can be in any mix of them.
#
# Only repos that pass the `openai-api-key` secret run Codex. Elsewhere, enrolment
# does nothing.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `ai-review-codex` label,
# without being on this list.
#
# See README.md in this directory.

