name: AI PR Review

on:
  pull_request:
    # closed is for the review's outcome experiments (outcome-experiment/README.md); it never starts a review.
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, closed]

jobs:
  claude-review:
    uses: artsy/duchamp/.github/workflows/claude-review.yml@main
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional: route reviews through Artsy's LiteLLM gateway, for the LiteLLM experiment
      # litellm-api-key: ${{ secrets.AI_REVIEW_LITELLM_API_KEY }}
      # litellm-edge-token: ${{ secrets.AI_REVIEW_LITELLM_EDGE_TOKEN }}
    # Optional: customize the model or timeout
    # with:
    #   model: "claude-opus-5-5"
    #   timeout-minutes: 30
