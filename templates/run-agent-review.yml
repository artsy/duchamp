name: AI PR Review

on:
  pull_request:
    # closed is for the review's outcome experiments (outcome-experiment/README.md); it never starts a review.
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, closed]

jobs:
  claude-review:
    uses: artsy/duchamp/.github/workflows/agent-review.yml@main
    secrets:
      # Every review goes through Artsy's LiteLLM gateway with this key.
      litellm-api-key: ${{ secrets.AI_REVIEW_LITELLM_API_KEY }}
      # Optional: for private repos listed in .claude-review.yml related_repos
      # review-app-private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
    # Optional: customize the model or timeout
    # with:
    #   model: "claude-opus-5-5"
    #   timeout-minutes: 30
