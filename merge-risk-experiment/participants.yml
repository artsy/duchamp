# GitHub logins enrolled in the merge risk experiment.
#
# Reviews of PRs by anyone on this list add a Merge Risk block to the summary: a low,
# medium or high rating, with a blast-radius read of what the change could break
# beyond the diff. This is separate from the other experiments: a PR can be in any mix
# of them.
#
# To join or leave, add or remove your login and open a PR. Case does not matter.
# Anyone can also try it on a single PR by adding the `ai-review-merge-risk` label,
# without being on this list.
#
# See README.md in this directory.

